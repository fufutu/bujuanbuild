name: Build Bujuan APK for Xiaodu 1S

on:
  workflow_dispatch:
  push:
    branches: [ build ] # 新仓库的默认分支是 build，不是 main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 不再需要 submodules: recursive，因为依赖已改为 Git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2' # 满足 pubspec 中 Dart >=3.10.0 的要求
          channel: 'stable'

      # 不再需要 Setup Rust，新仓库中未发现 Rust 相关文件

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --target-platform android-arm

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bujuan-xiaodu-1s
          # 由于 build.gradle 启用了 splits，产物路径会包含 abi 名称
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

